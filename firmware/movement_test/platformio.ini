[platformio]
extra_configs = ../../platformio-arduino-common.ini
src_dir = .
boards_dir = ../../boards
default_envs = n16r8

[env:n16r8]
; The PlatformIO .ino-to-C++ converter does not evaluate #if, so it emits the
; #include "wifi_local.h" line from the sketch as-is. The build needs the sketch
; folder on the include path for that line to resolve. The Arduino IDE adds it
; itself.
build_flags = ${env.build_flags} -I${PROJECT_DIR}
