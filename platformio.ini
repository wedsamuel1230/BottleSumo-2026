[platformio]
default_envs = robot
src_dir = firmware/bottlesumo_idf/main
boards_dir = boards

[env]
platform = platformio/espressif32@7.0.1
framework = espidf
board = esp32-s3-devkitc1-n16r8
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.partitions = firmware/bottlesumo_idf/partitions.csv
board_build.esp-idf.sdkconfig_path = firmware/bottlesumo_idf/sdkconfig
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

[env:robot]

[env:espnow_receiver]
board_build.esp-idf.sdkconfig_path = firmware/bottlesumo_idf/sdkconfig.receiver
build_flags = -DBOTTLESUMO_RECEIVER=1
