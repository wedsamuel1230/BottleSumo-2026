name: Arduino CLI build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile movement firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@7ef629dcdf0f458ab7ae83149d629443deac6eac
        with:
          version: "1.4.1"

      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.8

      - name: Compile for ESP32-S3-DEVKITC-1-N32R16
        run: >-
          arduino-cli compile --clean --warnings all
          --fqbn esp32:esp32:esp32s3-octal:FlashSize=32M
          firmware/movement_test
