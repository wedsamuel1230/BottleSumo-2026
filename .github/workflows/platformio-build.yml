name: PlatformIO firmware builds

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile all firmware programs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.11.8"
          python-version: "3.12"
          enable-cache: false

      - name: Install locked Python build and diagnostic tools
        run: uv sync --frozen

      - name: Check strategy and protocol contracts
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/competition-strategy-test.cpp -o /tmp/strategy-test
          /tmp/strategy-test
          c++ -std=c++17 -Wall -Wextra -Werror tests/wireless-protocol-test.cpp -o /tmp/protocol-test
          /tmp/protocol-test
          uv run --frozen python -m unittest discover -s tests -p test_bottlesumo_debug.py
          node tests/dashboard-keyboard-test.js
          c++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/bottlesumo_idf/components/vl53l0x/tests/stubs -Ifirmware/bottlesumo_idf/components/vl53l0x/include firmware/bottlesumo_idf/components/vl53l0x/tests/host_check.cpp firmware/bottlesumo_idf/components/vl53l0x/VL53L0X.cpp -o /tmp/tof-test
          /tmp/tof-test

      - name: Compile every PlatformIO firmware project
        run: ./scripts/validate-firmware.sh
