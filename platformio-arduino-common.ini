; Shared settings for the legacy Arduino programs. Each sketch keeps its own
; PlatformIO project root so no source files need to be copied or moved.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc1-n16r8

[arduino_libraries]
pololu_vl53l0x = https://github.com/pololu/vl53l0x-arduino.git#9f3773cb48d4e4e844d689cfc529a06f96d1d264
